/* ---------- geometry ---------- */
const solid=(x,y)=>{const gx=x/GS|0,gy=y/GS|0;return gx<0||gy<0||gx>=GW||gy>=GH?false:grid[gy*GW+gx]===1},solidM=(x,y)=>{const gx=x/GS|0,gy=y/GS|0;return gx<0||gy<0||gx>=GW||gy>=GH?false:gridM[gy*GW+gx]===1};
const blocked=(x,y)=>solid(x,y)||x<4||x>WW-4||y<4||y>WH-4;
function mkGrid(){grid.fill(0);gridM.fill(0);for(const w of walls){if(w.open)continue;const x0=Math.max(0,Math.floor(w.x/GS)),x1=Math.min(GW,Math.ceil((w.x+w.w)/GS)),y0=Math.max(0,Math.floor(w.y/GS)),y1=Math.min(GH,Math.ceil((w.y+w.h)/GS));for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const i=y*GW+x;gridM[i]=1;if(!w.win)grid[i]=1}}}

function losW(a,b,m){const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,nx=-dy/l*8,ny=dx/l*8;for(const s of[-1,0,1])if(!los({x:a.x+nx*s,y:a.y+ny*s},{x:b.x+nx*s,y:b.y+ny*s},m))return false;return true}
function nbrs(c){const o=[];for(const[dx,dy]of D){const n={x:c.x+dx,y:c.y+dy};if(inG(n.x,n.y)&&typ(K(c,n))!=='wall')o.push(n)}return o}
const cc=c=>({x:BX+c.x*CS+CS/2,y:BY+c.y*CS+CS/2}),cellOf=o=>{const x=Math.floor((o.x-BX)/CS),y=Math.floor((o.y-BY)/CS);return inG(x,y)?{x,y}:null};
function bfs(a,b){const q=[a],prev={};prev[k(a)]=null;while(q.length){const c=q.shift();if(c.x===b.x&&c.y===b.y)break;for(const n of nbrs(c))if(!(k(n)in prev)){prev[k(n)]=c;q.push(n)}}const p=[];let c=b;while(c){p.unshift(c);c=prev[k(c)]}return p}

function nextPt(e,t){

/* ---------- missions ---------- */
const TYPES={endless:{n:'Endless Run',d:'Push through building after building. Cash comes from knockouts, and payout grows each building.'},assassinate:{n:'Assassination',d:'Kill the target (a gold guard), then reach the exit.'},capture:{n:'Capture',d:'Knock out the target (do not kill), carry them to the exit.'},rescue:{n:'Rescue',d:'Find the unconscious prisoner, carry them to the exit. You cannot attack while carrying, but you can throw them.'}};
function mkMission(type,tier){const n=type==='endless'?0:4+tier*2;return{type,tier,al:rollAlarm(type,tier),pay:type==='endless'?0:{assassinate:300,capture:350,rescue:400}[type]*tier,n,na:ri(tier+1),ng:ri(tier+2),ns:ri(tier+2),ov:tier>=3,boss:type==='assassinate'||type==='capture'?{armor:tier>=2,sharp:tier>=2,gun:tier>=3}:null}}

      const inter=c.x>0&&c.y>0&&c.x<G-1&&c.y<R-1,s=inter&&Math.random()<.5?3:2,ox=s===3?c.x-1:Math.min(c.x,G-2),oy=s===3?c.y-1:Math.min(c.y,R-2);
      for(let i=0;i<s;i++)for(let j=0;j<s;j++){const a={x:ox+i,y:oy+j};merged.add(k(a));if(i<s-1)E.set(K(a,{x:a.x+1,y:a.y}),'open');if(j<s-1)E.set(K(a,{x:a.x,y:a.y+1}),'open')}}}
  for(let x=0;x<=G;x++)for(let y=0;y<R;y++){const t=typ('v'+x+','+y);if(t==='open')continue;const p=BX+x*CS,a=BY+y*CS,inner=x>0&&x<G;
    if(t==='wall'){if(inner&&Math.random()<.25){const gp=a+CS/2-28;seg(true,p,a,gp);seg(true,p,gp+56,a+CS);walls.push({x:p-T/2,y:gp,w:T,h:56,win:true})}else seg(true,p,a,a+CS)}
    else{line(true,p,a,a+CS,[a+CS/2-DOOR/2]);if(inner&&Math.random()<.45)walls.push({x:p-T/2,y:a+CS/2-DOOR/2,w:T,h:DOOR,dr:true,open:false})}}
  for(let y=0;y<=R;y++)for(let x=0;x<G;x++){const t=typ('h'+x+','+y);if(t==='open')continue;const p=BY+y*CS,a=BX+x*CS,inner=y>0&&y<R;
    if(t==='wall'){if(inner&&Math.random()<.25){const gp=a+CS/2-28;seg(false,p,a,gp);seg(false,p,gp+56,a+CS);walls.push({x:gp,y:p-T/2,w:56,h:T,win:true})}else seg(false,p,a,a+CS)}
    else{line(false,p,a,a+CS,[a+CS/2-DOOR/2]);if(inner&&Math.random()<.45)walls.push({x:a+CS/2-DOOR/2,y:p-T/2,w:DOOR,h:T,dr:true,open:false})}}

      txt('Left click / Space: attack or shoot   |   Right click / Q: PULL',VW/2,345,'15px sans-serif','#9aa4b2','center');
      txt('E: stairs, doors, windows, bodies   |   R: reload   |   T: throw mode   |   Shift/Tab: swap',VW/2,370,'15px sans-serif','#9aa4b2','center');
      txt('C or middle click: camo   |   U I O / J L / N K , : camo direction   |   M: mute   |   Esc: back',VW/2,395,'15px sans-serif','#9aa4b2','center')}
    else{
      txt('Left side: drag to move',VW/2,330,'15px sans-serif','#9aa4b2','center');
      txt('Right side: hold + drag the way you want to aim, release to throw or shoot',VW/2,360,'15px sans-serif','#9aa4b2','center');
      txt('Use the rug, computers, and box in the Hideout with the USE button',VW/2,390,'15px sans-serif','#9aa4b2','center')}}
  if(state==='play'&&mission.type==='endless'&&level===1&&msgT<=0){
    if(inputMode==='kbm')txt('[WASD] move | Click: attack | Right click/Q: PULL | E: use | R: reload | Shift: swap | C: camo (U I O J L N K , = direction)',20,VH-22,'12px sans-serif','#9aa4b2');
    else txt('Left: move  |  Right: tap = melee dash, hold + drag = aim and fire  |  THROW: toggle throwing  |  PULL: hold + drag to tether  |  USE: stairs, doors, windows, bodies',20,VH-22,'12px sans-serif','#9aa4b2')}
}
/* ---------- input ---------- */
const CAMO_KEYS={KeyU:[-1,-1],KeyI:[0,-1],KeyO:[1,-1],KeyJ:[-1,0],KeyL:[1,0],KeyN:[-1,1],KeyK:[0,1],Comma:[1,1],Numpad7:[-1,-1],Numpad8:[0,-1],Numpad9:[1,-1],Numpad4:[-1,0],Numpad6:[1,0],Numpad1:[-1,1],Numpad2:[0,1],Numpad3:[1,1]};
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*VW/r.width,y:(e.clientY-r.top)*VH/r.height}}
function camoPad(p){if(!save.act.includes('camo'))return false;const c=Math.floor((p.x-PX)/PC),r=Math.floor((p.y-PY)/PC);if(c>=0&&c<3&&r>=0&&r<3){if(c===1&&r===1)camoToggle();else cm.ang=Math.atan2(r-1,c-1);return true}return false}
function doChoice(kind){if(kind==='carry'){choiceE.carried=true;choiceE.wake=0;carry=choiceE;carry.fl=cf;sfx('pickup')}else if(kind==='kill'){choiceE.dead=true;kills++;sfx('kill')}state='play'}
function uiBack(){if(['shop','inv','missions'].includes(state)){state='hub';scr=0}else if(state==='custom'){state='inv';scr=0}else if(state==='brief')state='missions';else if(state==='choice')state='play'}
/* presses outside of gameplay; returns true when handled */
function screenPress(p,mouse,pid){
  if(state==='menu'){if(Math.abs(p.x-VW/2)<110&&Math.abs(p.y-252)<27)enterHub(true);return true}
  if(state==='caught'){enterHub(true);return true}
  if(state==='result'){save.money+=res.total;persist();enterHub(true);return true}
  if(state==='choice'){if(p.y>240&&p.y<304){if(p.x>VW/2-150&&p.x<VW/2-10)doChoice('carry');else if(p.x>VW/2+10&&p.x<VW/2+150)doChoice('kill');else state='play'}else state='play';return true}
  if(state==='won'){if(p.y>250&&p.y<330){if(p.x>VW/2-290&&p.x<VW/2-10){level++;build()}else if(p.x>VW/2+10&&p.x<VW/2+290)cashOut()}return true}
  if(['shop','inv','missions','brief','custom'].includes(state)){sd={y:p.y,sy:scr,moved:false,p,isMouse:mouse};if(!mouse)ptrs[pid]='s';return true}
  if(state==='hub'){if(mouse){if(nearId)hubUse()}else if(Math.hypot(p.x-(VW-60),p.y-(VH-60))<44)hubUse();else{ptrs[pid]='j';joy={ox:p.x,oy:p.y,x:p.x,y:p.y}}return true}
  return false}
cv.addEventListener('wheel',e=>{if(['shop','inv','missions'].includes(state)){e.preventDefault();scr=cl(scr+Math.sign(e.deltaY)*45,0,maxScr())}},{passive:false});
window.addEventListener('keydown',e=>{ac();setInputMode('kbm');keys[e.code]=true;
  if(['Space','KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
  if(e.repeat)return;
  if(e.code==='KeyM'){save.mute=!save.mute;persist();sfx('click')}
  if(e.code==='Escape'){uiBack();return}
  if(state==='menu'&&(e.code==='Space'||e.code==='Enter'))enterHub(true);
  else if(state==='hub'&&e.code==='KeyE')hubUse();
  else if(state==='caught'||state==='result'){if(e.code==='Space'||e.code==='Enter'||e.code==='KeyE')screenPress({x:0,y:0},true)}
  else if(state==='choice'){if(e.code==='KeyE')doChoice('carry');else if(e.code==='KeyK')doChoice('kill')}
  else if(state==='won'){if(e.code==='Enter'){level++;build()}}
  else if(state==='play'){
    if(e.code==='KeyE')interact();else if(e.code==='KeyR')reloadWeapon();else if(e.code==='KeyT'){rs.thr=!rs.thr;sfx('click')}
    else if((e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='Tab')&&save.carry.length>1){rs.cur=(rs.cur+1)%save.carry.length;sfx('click')}
    else if(e.code==='KeyC')camoToggle();else if(e.code==='KeyQ')tether(player.fa||0);else if(e.code==='Space')act(player.fa||0);
    else if(CAMO_KEYS[e.code]&&save.act.includes('camo')){const v=CAMO_KEYS[e.code];cm.ang=Math.atan2(v[1],v[0])}}});
window.addEventListener('keyup',e=>{keys[e.code]=false});
window.addEventListener('blur',()=>{for(const c in keys)keys[c]=false});
window.addEventListener('mousemove',e=>{mousePos=pos(e);if(sd&&sd.isMouse){if(Math.abs(mousePos.y-sd.y)>10)sd.moved=true;if(sd.moved)scr=cl(sd.sy-(mousePos.y-sd.y),0,maxScr())}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{ac();const p=pos(e),mouse=e.pointerType==='mouse';setInputMode(mouse?'kbm':'touch');
  if(!mouse){e.preventDefault();cv.setPointerCapture(e.pointerId)}
  if(p.x>VW-100&&p.y<34){save.mute=!save.mute;persist();sfx('click');return}
  if(screenPress(p,mouse,e.pointerId))return;
  if(camoPad(p))return;
  if(mouse){mousePos=p;if(e.button===0)act(player.fa||0);else if(e.button===2)tether(player.fa||0);else if(e.button===1){e.preventDefault();camoToggle()}return}
  for(const b of btns())if(Math.hypot(p.x-b.x,p.y-b.y)<b.r){b.f(e.pointerId,p);return}
  if(p.x<VW/2){ptrs[e.pointerId]='j';joy={ox:p.x,oy:p.y,x:p.x,y:p.y}}else{ptrs[e.pointerId]='a';slow=true;aim=p;aimO=p}});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')return;const p=pos(e),r=ptrs[e.pointerId];
  if(r==='j'&&joy){joy.x=p.x;joy.y=p.y}
  if(r==='a'){aim=p;if(aimO&&Math.hypot(p.x-aimO.x,p.y-aimO.y)>40)player.fa=Math.atan2(p.y-aimO.y,p.x-aimO.x)}
  if(r==='p'&&pj){pj.x=p.x;pj.y=p.y}
  if(r==='s'&&sd){if(Math.abs(p.y-sd.y)>10)sd.moved=true;if(sd.moved)scr=cl(sd.sy-(p.y-sd.y),0,maxScr())}});
function up(e){
  if(sd&&(sd.isMouse===(e.pointerType==='mouse'))){if(!sd.moved){sfx('click');const m0=save.money;tapUI(sd.p);if(save.money<m0)sfx('buy')}sd=null}
  if(e.pointerType==='mouse')return;
  const r=ptrs[e.pointerId];delete ptrs[e.pointerId];
  if(r==='j')joy=null;
  if(r==='p'&&pj){if(Math.hypot(pj.x-pj.ox,pj.y-pj.oy)>40)tether(Math.atan2(pj.y-pj.oy,pj.x-pj.ox));else tether(player.fa||0);pj=null;slow=false}
  if(r==='a'){if(aim&&aimO&&state==='play'){if(Math.hypot(aim.x-aimO.x,aim.y-aimO.y)>40)act(Math.atan2(aim.y-aimO.y,aim.x-aimO.x));else if(!carry&&!rs.thr&&WP[held()].t==='melee')meleeDash(player.fa||0,true)}slow=false;aim=null}}
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
let last=performance.now();
function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
mission={type:'endless'};build();state='menu';genMissions();requestAnimationFrame(loop);
</script></body></html>
